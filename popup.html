<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg:           #ffffff;
      --surface-2:    #fafafa;
      --surface-3:    #f5f5f5;
      --border:       #ececec;
      --border-2:     #e5e5e7;
      --text:         #0a0a0a;
      --text-2:       #404040;
      --text-3:       #737373;
      --text-4:       #a3a3a3;
      --accent:       #0a0a0a;
      --accent-hover: #262626;
      --good:         #16a34a;
      --warn:         #d97706;
      --bad:          #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
    }
    .wrap { padding: 16px; }

    /* Header */
    .head {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .mark {
      width: 30px; height: 30px;
      border-radius: 7px;
      overflow: hidden;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .mark img { width: 100%; height: 100%; display: block; }
    .head-meta { flex: 1; min-width: 0; }
    .head-meta h1 {
      margin: 0;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .head-meta p {
      margin: 1px 0 0;
      font-size: 11.5px;
      color: var(--text-3);
      font-family: "JetBrains Mono", monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      color: var(--text-2);
      font-size: 10.5px;
      font-weight: 500;
    }
    .pill .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--good);
    }

    /* Section */
    .section { margin-bottom: 16px; }
    .section-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title .meta {
      font-size: 10.5px;
      color: var(--text-4);
      letter-spacing: 0;
      text-transform: none;
      font-weight: 400;
      font-family: "JetBrains Mono", monospace;
    }

    /* Stat row */
    .stat-row {
      display: flex; align-items: end; justify-content: space-between;
      gap: 10px; margin-bottom: 10px;
    }
    .stat-num {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-num small {
      font-size: 13px; font-weight: 500; color: var(--text-3);
      letter-spacing: -0.01em;
    }
    .stat-meta {
      font-size: 11.5px; color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .stat-meta b { color: var(--text); font-weight: 600; }

    /* Progress */
    .progress {
      height: 3px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
    }
    .progress > span {
      display: block; height: 100%; width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .progress.warn > span { background: var(--warn); }
    .progress.bad > span  { background: var(--bad); }

    /* KV grid */
    .kv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      margin-top: 12px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .kv {
      padding: 9px 11px;
      background: var(--bg);
    }
    .kv .k {
      font-size: 10px; font-weight: 500;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .kv .v {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Token row */
    .tok-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .tok-cell {
      padding: 10px 11px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: left;
    }
    .tok-cell .k {
      font-size: 10px; font-weight: 500;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tok-cell .v {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .cost {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 8px;
      font-size: 12px;
    }
    .cost .row {
      display: flex; justify-content: space-between; width: 100%;
    }
    .cost .row + .row { margin-top: 4px; }
    .cost .label { color: var(--text-3); }
    .cost .val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* Buttons */
    .actions { display: grid; gap: 7px; margin-top: 4px; }
    .btn {
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all .12s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-ghost {
      background: var(--bg);
      color: var(--text-2);
      border-color: var(--border-2);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--text-3); background: var(--surface-2); }

    .footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 10.5px;
      color: var(--text-3);
    }
    .voice {
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--surface-3);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-2);
    }
    .voice.custom { background: #f0f9ff; color: #075985; }
    .voice.clipboard { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="mark"><img src="icons/icon48.png" alt="X Comment Generator" width="30" height="30"/></div>
      <div class="head-meta">
        <h1>Comment Generator</h1>
        <p id="modelLine">—</p>
      </div>
      <span class="pill"><span class="dot"></span> Draft</span>
    </header>

    <!-- Daily requests -->
    <section class="section">
      <div class="section-title">
        <span>Today's requests</span>
        <span class="meta" id="dateText">—</span>
      </div>

      <div class="stat-row">
        <div class="stat-num" id="usageBig">0 <small>/ 60</small></div>
        <div class="stat-meta"><b id="leftText">60</b> left</div>
      </div>
      <div class="progress" id="usageBarWrap"><span id="barFill"></span></div>

      <div class="kv-grid">
        <div class="kv"><div class="k">Cooldown</div><div class="v" id="cooldownText">—</div></div>
        <div class="kv"><div class="k">API key</div><div class="v" id="apiText">—</div></div>
      </div>
    </section>

    <!-- Token usage -->
    <section class="section">
      <div class="section-title"><span>Token usage</span><span class="meta">today</span></div>
      <div class="tok-row">
        <div class="tok-cell"><div class="k">In</div><div class="v" id="tokIn">0</div></div>
        <div class="tok-cell"><div class="k">Out</div><div class="v" id="tokOut">0</div></div>
        <div class="tok-cell"><div class="k">Total</div><div class="v" id="tokTotal">0</div></div>
      </div>
      <div class="cost">
        <div style="width:100%;">
          <div class="row"><span class="label">Today</span><span class="val" id="costToday">$0.00</span></div>
          <div class="row"><span class="label">Lifetime</span><span class="val" id="costLifetime">$0.00</span></div>
        </div>
      </div>
    </section>

    <!-- Actions -->
    <div class="actions">
      <button id="options" class="btn btn-primary">Open settings</button>
      <button id="reset" class="btn btn-ghost">Reset today's counter</button>
    </div>

    <div class="footer">
      <span>Voice: <span id="tonePill" class="voice">Default</span></span>
      <span>Output: <span id="modePill" class="voice">Insert</span></span>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>

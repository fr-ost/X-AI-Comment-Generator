<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{color-scheme:dark;--bg:#050816;--card:rgba(15,23,42,.72);--line:rgba(148,163,184,.22);--text:#eef6ff;--muted:#94a3b8;--blue:#1d9bf0;--violet:#8b5cf6;--pink:#ec4899;--green:#22c55e;--amber:#f59e0b}
    *{box-sizing:border-box} body{width:356px;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% -10%,rgba(29,155,240,.42),transparent 34%),radial-gradient(circle at 98% 8%,rgba(139,92,246,.34),transparent 36%),linear-gradient(180deg,#07111f 0%,#030712 100%);color:var(--text);overflow:hidden}.shell{position:relative;padding:16px}.shell:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.05),transparent);pointer-events:none}.hero{display:flex;align-items:center;gap:12px;margin-bottom:14px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--violet),var(--pink));display:grid;place-items:center;font-weight:950;font-size:19px;box-shadow:0 16px 36px rgba(29,155,240,.25),inset 0 1px 0 rgba(255,255,255,.28)}h1{font-size:18px;margin:0;letter-spacing:-.03em}.tag{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 8px;border:1px solid rgba(34,197,94,.28);border-radius:999px;background:rgba(34,197,94,.10);color:#bbf7d0;font-size:11px;font-weight:800}.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,23,42,.82),rgba(2,6,23,.74));box-shadow:0 18px 46px rgba(0,0,0,.28);backdrop-filter:blur(18px);border-radius:22px;padding:14px;margin:12px 0}.statTop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.muted{color:var(--muted);font-size:12px;line-height:1.45}.model{max-width:175px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:900;color:#dbeafe}.ringWrap{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),rgba(148,163,184,.18) 0);box-shadow:0 0 24px rgba(29,155,240,.17)}.ring:after{content:attr(data-value);width:48px;height:48px;border-radius:50%;background:#07111f;display:grid;place-items:center;font-weight:950;font-size:13px}.bar{height:10px;border-radius:999px;background:rgba(148,163,184,.16);overflow:hidden;border:1px solid rgba(148,163,184,.13)}.bar span{display:block;height:100%;width:var(--p);border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink));box-shadow:0 0 18px rgba(29,155,240,.35)}.usageLine{margin-top:7px;display:flex;justify-content:space-between;color:#cbd5e1;font-size:12px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.quickCard{border:1px solid rgba(148,163,184,.16);background:rgba(15,23,42,.58);border-radius:16px;padding:10px}.quickCard b{display:block;font-size:12px}.quickCard span{display:block;margin-top:3px;color:var(--muted);font-size:11px}button{width:100%;border:0;border-radius:999px;padding:11px 12px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 12px 26px rgba(29,155,240,.22);transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}button:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 16px 34px rgba(139,92,246,.28)}button:active{transform:translateY(0) scale(.98)}button.secondary{background:rgba(148,163,184,.13);color:#dbeafe;border:1px solid rgba(148,163,184,.22);box-shadow:none}.actions{display:grid;gap:8px;margin-top:12px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);display:inline-block;margin-right:6px}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="logo">X</div>
      <div>
        <h1>X Comment Generator</h1>
        <div class="tag"><span class="dot"></span>Draft-only mode</div>
      </div>
    </section>

    <section class="panel">
      <div class="statTop">
        <div>
          <div class="muted">Active model</div>
          <div class="model" id="modelName">Loading...</div>
        </div>
        <div class="muted" id="dateText"></div>
      </div>
      <div class="ringWrap">
        <div class="ring" id="ring" style="--p:0" data-value="0%"></div>
        <div>
          <div class="bar" style="--p:0%"><span id="barFill"></span></div>
          <div class="usageLine"><span id="usageText">0/0 requests</span><span id="leftText">0 left</span></div>
        </div>
      </div>
      <div class="quick">
        <div class="quickCard"><b id="cooldownText">Cooldown</b><span>Between clicks</span></div>
        <div class="quickCard"><b id="apiText">API key</b><span>Status</span></div>
      </div>
    </section>

    <div class="actions">
      <button id="options">Open Settings</button>
      <button id="reset" class="secondary">Reset Today’s Counter</button>
    </div>
    <div class="footer"><span>Unique Labs</span><span>Review before posting</span></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
